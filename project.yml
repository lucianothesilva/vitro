name: Vitro
options:
  bundleIdPrefix: com.luciano
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Vitro:
    type: application
    platform: macOS
    sources:
      - path: Sources/Vitro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luciano.Vitro
        PRODUCT_NAME: Vitro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vitro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Luciano. Licenciado sob a licença MIT."
        # Required for notarization later.
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # Ad-hoc signing for now (no Developer ID cert yet); swap to the
        # Developer ID identity once it exists.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
